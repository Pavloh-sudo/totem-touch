name: totem_touch
description: Tótem interactivo de GPA diseñado para Flutter Web.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  audioplayers: ^6.8.1
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
    - assets/mascot/gp/
    - assets/audio/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-VariableFont_wght.ttf
